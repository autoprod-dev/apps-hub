<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#071418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Autoprod Apps">
<title>Autoprod Apps</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #071418;
    --bg-2: #0b1e24;
    --card: #12262c;
    --card-hover: #173038;
    --line: rgba(255,255,255,.08);
    --text: #f4f7f8;
    --muted: #8aa3a8;
    --orange: #ff6a1a;
    --orange-2: #ff8a3d;
    --teal: #0d5c63;
    --live: #16a34a;
    --test: #d97706;
    --proto: #64748b;
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(13,92,99,.45), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: calc(22px + var(--safe-top)) 20px 12px;
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .brand img {
    width: 52px; height: 52px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .brand h1 {
    margin: 0;
    font-size: 1.45rem;
    letter-spacing: -.02em;
    line-height: 1.15;
  }
  .brand h1 span {
    display: block;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sub {
    color: var(--muted);
    margin: 10px 0 0;
    font-size: .95rem;
  }
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 8px 16px 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filters button {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font: 650 13px/1.1 system-ui, sans-serif;
    min-height: 40px;
  }
  .filters button[aria-pressed="true"] {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
  }
  main {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 16px 8px;
    max-width: 640px;
    margin: 0 auto;
  }
  h2.group {
    margin: 10px 4px 0;
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card {
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 14px;
    row-gap: 10px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    border-left: 5px solid var(--accent, var(--orange));
  }
  .icon {
    grid-row: 1 / 2;
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(255,255,255,.05);
    display: grid; place-items: center;
    font-size: 1.4rem;
    line-height: 1;
  }
  .meta { grid-column: 2; min-width: 0; }
  .title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .title {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .desc {
    color: var(--muted);
    font-size: .9rem;
    margin-top: 4px;
    line-height: 1.4;
  }
  .tag {
    flex: 0 0 auto;
    font-size: .65rem;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    color: #fff;
    background: var(--proto);
  }
  .tag.live { background: var(--live); }
  .tag.test { background: var(--test); }
  .actions {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 12px;
    background: var(--orange);
    color: #fff;
    font-weight: 700;
    font-size: .95rem;
    text-decoration: none;
    border: 0;
  }
  .btn:active { transform: scale(.98); }
  .btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
  }
  .offline {
    color: var(--muted);
    font-size: .88rem;
    font-weight: 600;
    padding: 8px 2px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: .78rem;
    padding: 16px 20px calc(28px + var(--safe-bot));
    max-width: 640px;
    margin: 0 auto;
    line-height: 1.45;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 24px 8px;
  }

  .toolbar {
    padding: 8px 16px 4px;
    max-width: 640px;
    margin: 0 auto;
  }
  .search {
    width: 100%;
    min-height: 44px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    font: 500 16px/1.2 system-ui, sans-serif;
    padding: 0 14px;
    -webkit-appearance: none;
    appearance: none;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus {
    outline: 2px solid var(--orange);
    outline-offset: 1px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (min-width: 720px) {
    main, .toolbar, .filters { max-width: 980px; }
    main { display: grid; grid-template-columns: 1fr 1fr; }
    .filters, .toolbar { margin-left: auto; margin-right: auto; width: 100%; }
    h2.group, .empty { grid-column: 1 / -1; }
  }

</style>
</head>

<script>
(function () {
  const STATUS_ORDER = ["Live", "Test", "Prototype"];
  const CATEGORY_ORDER = [
    "Work & Kitchen",
    "Business",
    "Money & Home",
    "Family & Health",
    "Games & Fun",
    "Tools"
  ];
  const TAG_CLASS = { Live: "live", Test: "test", Prototype: "proto" };
  let data = { programs: [] };
  let filter = "all";
  let query = "";

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function categoryOf(p) {
    const c = String(p && p.category || "").trim();
    return c || "Other";
  }

  function statusOf(p) {
    return STATUS_ORDER.includes(p.status) ? p.status : "Prototype";
  }

  function actions(p) {
    const url = p.url && String(p.url).trim();
    const local = p.local && String(p.local).trim();
    const bits = [];
    if (url) {
      bits.push(`<a class="btn" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Open</a>`);
      if (local) {
        bits.push(`<a class="btn secondary" href="${escapeHtml(local)}">Local copy</a>`);
      }
    } else if (local) {
      bits.push(`<span class="offline">Not online yet</span>`);
      bits.push(`<a class="btn" href="${escapeHtml(local)}">Open local copy</a>`);
    } else {
      bits.push(`<span class="offline">Not online yet</span>`);
    }
    return bits.join("");
  }

  function card(p) {
    const status = statusOf(p);
    const accent = p.accent || "#ff6a1a";
    const cat = categoryOf(p);
    return `<article class="card" style="--accent:${escapeHtml(accent)}" data-id="${escapeHtml(p.id || "")}" data-status="${escapeHtml(status)}" data-category="${escapeHtml(cat)}">
      <div class="icon" aria-hidden="true">${escapeHtml(p.icon || "◆")}</div>
      <div class="meta">
        <div class="title-row">
          <div class="title">${escapeHtml(p.name)}</div>
          <span class="tag ${TAG_CLASS[status] || "proto"}">${escapeHtml(status)}</span>
        </div>
        <div class="desc">${escapeHtml(p.description)}</div>
      </div>
      <div class="actions">${actions(p)}</div>
    </article>`;
  }

  function matchesQuery(p, q) {
    if (!q) return true;
    const hay = [p.name, p.description, p.status, categoryOf(p), p.id]
      .join(" ")
      .toLowerCase();
    return hay.includes(q);
  }

  function categoryList(programs) {
    const present = new Set(programs.map(categoryOf));
    const cats = CATEGORY_ORDER.filter(c => present.has(c));
    for (const c of present) {
      if (!cats.includes(c)) cats.push(c);
    }
    return cats;
  }

  function renderChips(programs) {
    const nav = document.getElementById("filters");
    if (!nav) return;
    const items = [["all", "All"]].concat(categoryList(programs).map(c => [c, c]));
    nav.innerHTML = items.map(([value, label]) => {
      const pressed = filter === value ? "true" : "false";
      return `<button type="button" data-filter="${escapeHtml(value)}" aria-pressed="${pressed}">${escapeHtml(label)}</button>`;
    }).join("");
    nav.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        filter = btn.getAttribute("data-filter") || "all";
        nav.querySelectorAll("button").forEach(b => {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        render();
      });
    });
  }

  function render() {
    const programs = Array.isArray(data.programs) ? data.programs : [];
    const q = query.trim().toLowerCase();
    let visible = programs.filter(p => matchesQuery(p, q));
    if (filter !== "all") {
      visible = visible.filter(p => categoryOf(p) === filter);
    }
    const root = document.getElementById("list");
    if (!visible.length) {
      root.innerHTML = `<p class="empty">No programs in this view.</p>`;
      return;
    }
    const cats = categoryList(visible);
    const html = [];
    for (const c of cats) {
      const group = visible.filter(p => categoryOf(p) === c);
      if (!group.length) continue;
      group.sort((a, b) => STATUS_ORDER.indexOf(statusOf(a)) - STATUS_ORDER.indexOf(statusOf(b)));
      html.push(`<h2 class="group">${escapeHtml(c)}</h2>`);
      html.push(group.map(card).join(""));
    }
    root.innerHTML = html.join("");
  }

  const search = document.getElementById("search");
  if (search) {
    search.addEventListener("input", (e) => {
      query = e.target.value || "";
      render();
    });
  }

  async function load() {
    let loaded = null;
    try {
      const res = await fetch("programs.json", { cache: "no-store" });
      if (res.ok) loaded = await res.json();
    } catch (e) { /* file:// or offline: use the inlined copy */ }
    if (!loaded) {
      try {
        loaded = JSON.parse(document.getElementById("programs-data").textContent || "{}");
      } catch (e) {
        loaded = { programs: [] };
      }
    }
    data = loaded || { programs: [] };
    if (data.subtitle) document.getElementById("subtitle").textContent = data.subtitle;
    const updated = data.updated ? `Updated ${data.updated}.` : "";
    const updatedEl = document.getElementById("updated");
    if (updatedEl) updatedEl.textContent = updated;
    renderChips(Array.isArray(data.programs) ? data.programs : []);
    render();
  }

  load();
})();
</script>
